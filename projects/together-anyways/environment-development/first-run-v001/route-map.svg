<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
<title id="title">Together Anyways — first-run route proposal</title>
<desc id="desc">Market approach to water broker, separate decoy and covert exits converging at the pipe court, then one controlled door into a freight relay hall with an interior broadcast screen.</desc>
