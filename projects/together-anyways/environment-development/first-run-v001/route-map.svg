 <marker id="decoy" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a94e2f" stroke-width="2"/></marker>
 <marker id="quiet" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#316d94" stroke-width="2"/></marker>
</defs>
