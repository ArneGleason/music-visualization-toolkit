  const [kAge, kMag] = lastHit('kick', t);
  const [sAge, sMag] = lastHit('snare', t);
  const [hAge, hMag] = lastHit('hat', t);
  // Punch is a fast attack and a fast decay. These envelopes are much shorter
  // than they were: a kick that hangs around for a third of a second reads as
  // a swell, not a hit.
  const kE = Math.exp(-kAge / 0.105) * kMag * P.tunnel;
  const kBody = Math.exp(-kAge / 0.32) * kMag * P.tunnel;
  const sE = Math.exp(-sAge / 0.092) * sMag * P.tunnel;
  const hE = Math.exp(-hAge / 0.080) * hMag * P.sparks;
  // the CONTINUOUS cymbal envelope, as distinct from the strikes on it
  const hBand = kit ? clamp(kit.bands[5] * 1.6 + kit.bands[4] * 0.8, 0, 1.4) : 0;

  const showE = SHOW.build * (1 - SHOW.tear);
  floorMat.opacity = (0.11 + 0.95 * kE + 0.22 * kBody) * showE;
  ring.scale.setScalar(1.0 + clamp(kAge, 0, 0.55) * 26);
  ring2.scale.setScalar(1.0 + clamp(kAge, 0, 0.55) * 15);
  ringMat.opacity = clamp(kE * 1.25, 0, 1.4);
  ring2.material.opacity = clamp(kBody * 0.40, 0, 0.6);
  sheet.scale.setScalar(0.7 + clamp(sAge, 0, 0.45) * 27);
  sheet.rotation.z = sAge * 0.9;
  sheetMat.opacity = clamp(sE * 1.78, 0, 1.7);
  // a very short whole-frame lift — what makes a backbeat feel like it hits
  // the room rather than a shape inside it
  FLASH = clamp(sE * 0.105 + kE * 0.03, 0, 0.15);

  // ── the spark field ──
  {
    const spin = t * 0.026;
    // reach and count BOTH follow the cymbal envelope, so a build pushes the
    // field outward and fills it in at the same time
    const reach = 0.80 + 0.34 * hBand + 0.26 * hE;
    const live = Math.min(SPARKS, Math.floor(SPARKS *
                          clamp(0.10 + 1.25 * hBand + 0.9 * hE, 0, 1)));
    let k = 0;
    for (let i = 0; i < live; i++) {
      const a0 = sparkSeed[i * 4] + spin + sparkSeed[i * 4 + 2] * t * 0.05;
      const r0 = sparkSeed[i * 4 + 1] * reach;
      const ph = sparkSeed[i * 4 + 3];
      // each spark answers the strike at its own moment, so the field ripples
      // outward rather than blinking as one — that is what reads as an
      // envelope instead of a flash
      const local = Math.exp(-Math.max(0, hAge - ph * 0.070) / 0.075) * hMag;
      const puff = 1 + 0.16 * local;
      const blow = 1 + SHOW.tear * SHOW.tear * 3.2;
      sparks.pos[k * 3]     = Math.cos(a0) * r0 * SPARK_HH * 1.78 * puff * blow;
      sparks.pos[k * 3 + 1] = Math.sin(a0) * r0 * SPARK_HH * puff * blow;
      sparks.pos[k * 3 + 2] = SPARK_Z + sparkSeed[i * 4 + 2] * 1.6;
      sparks.col[k * 3] = SPARK_COL[0];
      sparks.col[k * 3 + 1] = SPARK_COL[1];
      sparks.col[k * 3 + 2] = SPARK_COL[2];
      sparks.size[k] = 1.5 + 8.0 * local * P.sparks + 2.4 * hBand;
      sparks.int[k] = clamp((0.06 * hBand + 0.70 * local) * P.sparks, 0, 0.9)
                    * (SHOW.build * (1 - SHOW.tear * 0.6));
      k++;
    }
    sparks.commit(k);
  }

  updateLine(t, dt, P.lift * SHOW.build * (1 - SHOW.tear));
  updateTitle(t);
  updateLiner(t, SHOW.build * (1 - SHOW.tear));

  panel.update(t, dt, SHOW.build * (1 - SHOW.tear));

  // ── camera ──
  // A slow orbit whose rate is the section's, dipping on every kick. The
  // whole cast is a constellation, so the camera has to move for the figures
  // to read as three-dimensional rather than as flat overlapping drawings.
  if (!camPhaseInit) { camPhase = t * 0.09; camPhaseInit = true; }
  camPhase += dt * 0.026 * P.orbit;
  const R = (13.2 + 34.0 * (1 - SHOW.build) + 22.0 * SHOW.tear)
          * (1.08 - 0.12 * P.spread) * (1 - 0.028 * kE);
  const el = 1.5 + Math.sin(camPhase * 0.47) * 0.85 - kE * 0.35;
  camera.position.set(Math.cos(camPhase) * R, el, Math.sin(camPhase) * R);
  camera.lookAt(0, 0.45 + Math.sin(camPhase * 0.31) * 0.35, 0);
  camera.rotation.z += Math.sin(camPhase * 0.61) * 0.022 + sE * 0.008;

  sheet.quaternion.copy(camera.quaternion);   // shockwave faces the lens

  enforceStageHierarchy(t, dt);

  // ── note impacts ──
  for (const a of actors) {
    // Keep the cursor on the clock while the actor is absent. Otherwise a
    // returning player replays a backlog of impacts from its offstage time.
    if (!a.noteT.length || a.presence < 0.05) { a.lastFired = t; continue; }
    let j = lowerBound(a.noteT, a.lastFired ?? (t - 0.001));
    let fired = 0;
    while (j < a.notes.length && a.notes[j][0] <= t && fired < 3) {
      if (a.notes[j][0] > (a.lastFired ?? -1) && a.notes[j][3] > 0.25) {
        fireImpact(a, a.notes[j][3], a.hue + (a.notes[j][2] % 12) / 40,
                   a.notes[j][2]);
        fired++;
      }
      j++;
    }
    a.lastFired = t;
  }
  updateImpacts(dt);
  updateTags(t, dt);

  updateArrivals(t, P);        // after the camera: they fly along its axis
  updatePerformanceRail(t, P); // additive pitch-readable Rock Band cue

  COMP_UNIFORMS.uFlash.value = FLASH;
  COMP_UNIFORMS.uIntro.value = P.intro;
  COMP_UNIFORMS.uKind.value = P.introKind;
  COMP_UNIFORMS.uAge.value = P.introAge || 0;
  COMP_UNIFORMS.uAspect.value = RW / Math.max(1, RH);
  COMP_UNIFORMS.uBgA.value.setRGB(P.bgA[0], P.bgA[1], P.bgA[2]);
  COMP_UNIFORMS.uBgA2.value.setRGB(P.bgA2[0], P.bgA2[1], P.bgA2[2]);
  COMP_UNIFORMS.uBgB.value.setRGB(P.bgB[0], P.bgB[1], P.bgB[2]);
  COMP_UNIFORMS.uBgB2.value.setRGB(P.bgB2[0], P.bgB2[1], P.bgB2[2]);
  COMP_UNIFORMS.uBgF.value = P.bgF;
  COMP_UNIFORMS.uBgWipe.value = P.bgWipe;
  COMP_UNIFORMS.uGlow.value = 0.42 + 0.38 * P.glow;
  COMP_UNIFORMS.uTint.value.setRGB(P.tint[0] * 0.5, P.tint[1] * 0.5, P.tint[2] * 0.5);

  if (acc) return;           // offline render: the HUD is hidden, skip the layout
  hud.textContent =
    `${(t / 60) | 0}:${(t % 60).toFixed(2).padStart(5, '0')}   ${P.id} · ${P.arch}\n` +
    `trail ${P.trailAmt.toFixed(2)}/${P.trailLife.toFixed(1)}s  twist ${tw.toFixed(2)}  ` +
    `pan ${pan.toFixed(2)}\n` +
    actors.map(a => `${a.name.slice(0, 14).padEnd(15)}` +
      `sal ${(a.sal ?? 0).toFixed(2)}  on ${a.presence.toFixed(2)}` +
      (a.presence > 0.02 ? '  ●' : '')).join('\n');
}

function renderUILayer() {
  renderer.setRenderTarget(rtUI);
  renderer.clear();
  camera.layers.set(UI_LAYER);
  renderer.render(scene, camera);
  camera.layers.set(STAGE_LAYER);
}

function renderPasses(dest = null, add = false, includeUI = true) {
  for (const a of actors) {
    a.line.mat.uniforms.uRes.value.set(RW, RH);
    a.haze.mat.uniforms.uRes.value.set(RW, RH);
    for (const g of a.ghosts) g.mat.uniforms.uRes.value.set(RW, RH);
    if (a.faceRig) a.faceRig.setRes(RW, RH);
  }
  for (const l of railLasers) l.mat.uniforms.uRes.value.set(RW, RH);
  panel.setRes(RW, RH);
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  camera.layers.set(STAGE_LAYER);
  renderer.render(scene, camera);

  if (includeUI) renderUILayer();
  COMP_UNIFORMS.uUi.value = includeUI ? 1 : 0;

  brightMat.uniforms.tDiffuse.value = rtScene.texture;
  blit(brightMat, rtA);
  blurMat.uniforms.tDiffuse.value = rtA.texture;
  blurMat.uniforms.uDir.value.set(1 / (RW >> 1), 0); blit(blurMat, rtB);
  blurMat.uniforms.tDiffuse.value = rtB.texture;
  blurMat.uniforms.uDir.value.set(0, 1 / (RH >> 1)); blit(blurMat, rtA);

  blurMat.uniforms.tDiffuse.value = rtA.texture;
  blurMat.uniforms.uDir.value.set(2.2 / (RW >> 2), 0); blit(blurMat, rtC);
  blurMat.uniforms.tDiffuse.value = rtC.texture;
  blurMat.uniforms.uDir.value.set(0, 2.2 / (RH >> 2)); blit(blurMat, rtD);

  COMP_UNIFORMS.tScene.value = rtScene.texture;
  COMP_UNIFORMS.tUI.value = rtUI.texture;
  COMP_UNIFORMS.tB1.value = rtA.texture;
  COMP_UNIFORMS.tB2.value = rtD.texture;
  quad.material = add ? compAddMat : compMat;
  renderer.setRenderTarget(dest);
  if (!add) renderer.clear();
  renderer.render(quadScene, quadCam);
  renderer.setRenderTarget(null);
}

window.setTime = (t, dt) => { setTime(t, dt); renderPasses(null, false); };
// profiling hooks: the simulation and the GL work, separable
window.__sim = setTime;
window.__gl  = () => renderPasses(null, false);

// ── offline render harness ─────────────────────────────────────────────────
// Same contract as world/index.html: renderFrame advances the whole
// simulation N times inside one output frame and averages, so every beam
// smears along its real path. For vector work this matters more than it does
// for solids — the streak IS the persistence of vision a real laser relies on.
let acc = null, accCtx = null;
window.setRenderSize = (w, h) => {
  RES_SCALE = beamScale(h);
  applyResScale();
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  makeTargets(w, h);
  acc = document.createElement('canvas'); acc.width = w; acc.height = h;
  accCtx = acc.getContext('2d', {willReadFrequently: false});
  acc.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:auto;z-index:5';
  acc.id = 'out';
  document.body.appendChild(acc);
  document.getElementById('bar').style.display = 'none';
  hud.style.display = 'none';
  renderer.domElement.style.display = 'none';
};
// Accumulation motion blur, entirely on the GPU. The previous shape of this
// composited each sub-frame onto a 2D canvas with 'lighter', which meant N
// canvas-to-canvas copies AND N implicit flushes of the WebGL surface per
// output frame — the GPU spent most of its time waiting to be read. Now the
// sub-frames sum into a half-float target with additive blending and exactly
// ONE copy leaves the GPU per output frame, for the screenshot.
window.renderFrame = (t, frameDt, N) => {
  const step = frameDt / N;
  COMP_UNIFORMS.uScale.value = 1 / N;
  renderer.setRenderTarget(rtAcc);
  renderer.setClearColor(0x000000, 1);
  renderer.clear(true, false, false);
  // UI is sampled once per output frame, not N times. Typography should be
  // readable information, not a motion trail; the actors alone receive the
  // temporal integration.
  renderer.setRenderTarget(rtUI);
  renderer.clear(true, false, false);
  renderer.setRenderTarget(null);
  for (let k = 0; k < N; k++) {
    setTime(t + k * step, step);
    renderPasses(rtAcc, true, false);
  }
  COMP_UNIFORMS.uScale.value = 1;
  copyMat.uniforms.tDiffuse.value = rtAcc.texture;
  blit(copyMat, null);
  renderUILayer();
  uiOverlayMat.uniforms.tDiffuse.value = rtUI.texture;
  quad.material = uiOverlayMat;
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCam);
  accCtx.drawImage(renderer.domElement, 0, 0);
};

// A truthful GPU measurement. GL calls queue asynchronously, so timing them
// without forcing completion measures submission, not work. Reading one pixel
// back blocks until the frame is actually finished.
window.__probe = (t, N, reps) => {
  const gl = renderer.getContext(), px = new Uint8Array(4);
  const sync = () => { renderer.setRenderTarget(rtAcc);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    renderer.setRenderTarget(null); };
  for (let k = 0; k < 12; k++) setTime(t + k * 0.01, 0.01);   // warm the JIT
  window.renderFrame(t, 1 / 60, N); sync();
  let sim = 0, total = 0;
  for (let r = 0; r < reps; r++) {
    const tt = t + r / 60;
    let s = performance.now();
    for (let k = 0; k < N; k++) setTime(tt + k / (60 * N), 1 / (60 * N));
    sim += performance.now() - s;
    s = performance.now();
    window.renderFrame(tt, 1 / 60, N);
    sync();
    total += performance.now() - s;
  }
  return {simMs: sim / reps, frameMs: total / reps,
          gpuMs: Math.max(0, (total - sim) / reps), n: N};
};
RES_SCALE = beamScale(innerHeight); applyResScale();
{
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  window.__gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
                     : gl.getParameter(gl.RENDERER);
}

// ── live playback ──────────────────────────────────────────────────────────
const audio = new Audio('../audio/song.wav');
audio.preload = 'auto';
let playing = false, tNow = 0, last = performance.now();
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub');
playBtn.onclick = () => {
  playing = !playing;
  if (playing) { audio.currentTime = tNow; audio.play(); playBtn.textContent = '❚❚'; }
  else { audio.pause(); playBtn.textContent = '▶'; }
};
scrub.oninput = () => {
  tNow = (+scrub.value / 1000) * D.duration;
  if (playing) audio.currentTime = tNow;
};
const secsEl = document.getElementById('secs');
for (const s of D.sections) {
  const b = document.createElement('b');
  b.textContent = s.id;
  b.onclick = () => { tNow = s.t0; if (playing) audio.currentTime = tNow;
                      scrub.value = String((tNow / D.duration) * 1000); };
  secsEl.appendChild(b);
}
addEventListener('resize', () => {
  if (acc) return;
  RES_SCALE = beamScale(innerHeight); applyResScale();
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  makeTargets(innerWidth, innerHeight);
});

function loop() {
  requestAnimationFrame(loop);
  if (acc) return;                            // offline render owns the clock
  const now = performance.now();
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) { tNow = audio.currentTime; } else { dt = dt; }
  setTime(tNow, Math.max(1 / 240, dt));
  renderPasses(null, false);
  scrub.value = String((tNow / D.duration) * 1000);
}
loop();
window.__A = actors;
window.__D = D;
window.__ready = true;
</script>
</body>
</html>
