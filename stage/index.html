<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Music Visualization — vector stage</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden;
            font:13px/1.4 -apple-system,system-ui,sans-serif;color:#7c828c}
  canvas{display:block}
  #hud{position:fixed;left:14px;bottom:12px;opacity:.7;pointer-events:none;
       font-variant-numeric:tabular-nums;white-space:pre}
  #bar{position:fixed;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;
       padding:9px 14px;background:linear-gradient(#000000dd,#00000000);z-index:9}
  #play{padding:6px 13px;border:1px solid #2c323c;background:#0e1015;color:#c9cfd8;
        border-radius:5px;cursor:pointer;font:inherit}
  #scrub{flex:1;accent-color:#4ec8ff;cursor:pointer}
  #secs{display:flex;gap:5px;flex-wrap:wrap}
  #secs b{font-weight:500;padding:3px 7px;border-radius:4px;background:#14171e;
          color:#98a0ac;cursor:pointer;font-size:11px}
  #secs b:hover{background:#252b36;color:#e6e9ee}
</style>
</head>
<body>
<div id="bar">
  <button id="play">▶</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
  <span id="secs"></span>
</div>
<div id="hud"></div>

<script type="importmap">
{"imports":{"three":"../world/three/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import {makePanel} from './readouts.js';

// ═══════════════════════════════════════════════════════════════════════════
// THE VECTOR STAGE
//
// Every instrument is a LINE, not a blob. A laser show works because a single
// beam traces a closed figure fast enough that you see the whole shape at
// once — the information is in the PATH, not in the fill. So each actor here
// gets a parametric 3D curve, and the music writes information onto it in
// four independent ways that don't compete for the same visual channel:
//
//   the FAMILY of curve      what instrument this is        (identity)
//   its PARAMETERS           how busy/wide/bright the part is (state)
//   displacement ALONG ARC   the six-band spectrum          (timbre)
//   travelling BEADS         individual note events         (events)
//
// and then the DAW automation transforms the whole figure — reverb becomes
// visible as ghost curves trailing behind in time, a send opening up blooms
// the beam into haze, pan swings the actor around the ring, transpose twists
// it. Those are the moves that were actually drawn in Bitwig, made physical.
//
// Everything is additive with a bright core and a soft skirt, then bloomed.
// That combination — additive, cored, bloomed — is what reads as "laser"
// rather than "wireframe".
// ═══════════════════════════════════════════════════════════════════════════

const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp  = (a, b, f) => a + (b - a) * f;
const smooth = x => x * x * (3 - 2 * x);

const D = await (await fetch('./data.json')).json();
const RATE = D.rate, NS = D.n;
const QUERY = new URLSearchParams(window.location.search);
function queryNumber(name, dflt) {
  const v = Number.parseFloat(QUERY.get(name));
  return Number.isFinite(v) ? v : dflt;
}
// Quarter-speed is the selected default. Both controls are URL-addressable so a
// diagnostic can compare rates without changing the underlying stage data.
const VOCAL_RATE = clamp(queryNumber('vocalRate', 0.25), 0.20, 1.0);
const VOCAL_GAIN = clamp(queryNumber('vocalGain', 1.85), 0.25, 3.0);
const MIDI_RAIL_GAIN = clamp(queryNumber('midiRail', 1.0), 0, 2.0);

// sample any exported series at a time, with linear interpolation
function at(arr, t, dflt = 0) {
  if (!arr || !arr.length) return dflt;
  const x = clamp(t * RATE, 0, arr.length - 1.001);
  const i = x | 0, f = x - i;
  return arr[i] + (arr[i + 1] - arr[i]) * f;
}

// The articulation grid is 30 Hz, but the actual lead-vocal carrier is much
// denser. Keep its own clock: it is a signed, band-limited waveform rather
// than an envelope pretending to be one.
function atRate(arr, rate, t, dflt = 0) {
  if (!arr || !arr.length || !rate) return dflt;
  const x = clamp(t * rate, 0, arr.length - 1.001);
  const i = x | 0, f = x - i;
  return arr[i] + (arr[i + 1] - arr[i]) * f;
}
function vocalWaveRaw(t) {
  return atRate(D.mouth.signal, D.mouth.signal_rate, t, 0) / 127;
}
function vocalWave(t) {
  if (VOCAL_RATE > 0.999) return vocalWaveRaw(t);
  // Locally time-stretch overlapping 72 ms grains around their real position
  // in the song. The carrier runs slower inside each grain, but every grain is
  // re-anchored to current mix time, so syllables and phonemes never drift.
  const hop = 0.072;
  const c0 = Math.floor(t / hop) * hop, c1 = c0 + hop;
  const f = smooth((t - c0) / hop);
  const a = vocalWaveRaw(c0 + (t - c0) * VOCAL_RATE);
  const b = vocalWaveRaw(c1 + (t - c1) * VOCAL_RATE);
  return lerp(a, b, f);
}

// Strong vocal phrase attacks earn a brief full-face punctuation. Selection
// is deterministic and data-led: find the strongest lead-vocal attack near a
// lyric-line entrance, then keep the moments far enough apart that a face
// still feels like an event rather than the vocalist's permanent costume.
const FACE_CUES = (() => {
  const key = Object.keys(D.actors).find(n => /lead vocal/i.test(n));
  const spec = key ? D.actors[key] : null;
  if (!spec || !spec.attack || !D.lines) return [];
  const out = [];
  let last = -99;
  for (const line of D.lines) {
    const i0 = Math.max(0, Math.floor(line.t * RATE));
    const i1 = Math.min(spec.attack.length, Math.ceil((line.t + 1.15) * RATE));
    let best = 0, bi = i0;
    for (let i = i0; i < i1; i++) if (spec.attack[i] > best) {
      best = spec.attack[i]; bi = i;
    }
    const t = bi / RATE;
    if (best >= 0.56 && t - last >= 7.5) {
      out.push({t, strength: best}); last = t;
    }
  }
  return out;
})();
function faceCueAt(t) {
  let e = 0;
  for (const cue of FACE_CUES) {
    const age = t - cue.t;
    if (age < -0.20) break;
    if (age > 1.85) continue;
    const env = age < 0 ? smooth(clamp((age + 0.20) / 0.20, 0, 1))
              : age < 1.05 ? 1
              : smooth(clamp((1.85 - age) / 0.80, 0, 1));
    e = Math.max(e, env * (0.78 + 0.22 * cue.strength));
  }
  return e;
}

// ── renderer ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 400);
scene.add(camera);   // the instrument panel hangs off the camera
const STAGE_LAYER = 0;
const UI_LAYER = 1;  // rendered cleanly after bloom, through the same tone map

// ── the laser line ─────────────────────────────────────────────────────────
// WebGL will not draw a line thicker than one pixel, so a beam has to be
// built as geometry: two vertices per path point, pushed apart in SCREEN
// space along the path normal in the vertex shader. That keeps the beam a
// constant apparent width no matter how far away it is — which is exactly how
// a real beam behaves, and why this reads as light rather than as a tube.
//
// The fragment shader gives every beam a hard bright core inside a soft
// skirt. Additive, no depth test: beams pass through each other and add up,
// the way light does.

const LINE_VERT = `
attribute vec3 aPrev, aNext, aColor;
attribute float aSide, aInt;
uniform vec2  uRes;
uniform float uWidth, uBoost;
varying vec3  vColor;
varying float vSide, vInt;
vec2 toScreen(vec4 c){ return c.xy / max(c.w, 1e-5) * uRes * 0.5; }
void main(){
  vec4 cc = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  vec4 cp = projectionMatrix * modelViewMatrix * vec4(aPrev,    1.0);
  vec4 cn = projectionMatrix * modelViewMatrix * vec4(aNext,    1.0);
  vec2 sc = toScreen(cc), sp = toScreen(cp), sn = toScreen(cn);
  vec2 d  = sn - sp;
  if (dot(d, d) < 1e-9) d = vec2(1.0, 0.0);
  d = normalize(d);
  vec2 nrm = vec2(-d.y, d.x);
  float w = uWidth * (0.72 + 1.5 * aInt) * uBoost;
  cc.xy += nrm * aSide * (w * 2.0) / uRes * cc.w;
  vColor = aColor; vSide = aSide; vInt = aInt;
  gl_Position = cc;
}`;

const LINE_FRAG = `
precision highp float;
uniform float uAlpha, uFloor;
varying vec3  vColor;
varying float vSide, vInt;
void main(){
  float a = 1.0 - abs(vSide);          // 1 at the beam centre, 0 at its edge
  float skirt = pow(max(a, 0.0), 1.7);
  // A broad, substantial core with only enough skirt to catch motion. The
  // old skirt carried almost a third of the beam energy; after bloom and
  // temporal integration that became the beam, rather than a glow around it.
  float core  = pow(max(a, 0.0), 4.5);
  float e = (skirt * 0.16 + core * 1.90) * (uFloor + 1.30 * vInt) * uAlpha * 1.62;
  if (e <= 0.001) discard;
  gl_FragColor = vec4(vColor * e, 1.0);
}`;

// ── a cloud of points, per-point size and colour ─────────────────────────
// PointsMaterial has one size for the whole system, which is no use when the
// point IS the measurement. This is the same idea as the beam shader: the
// attribute carries the data and the fragment makes it round and hot.
const CLOUD_VERT = `
attribute float aSize; attribute vec3 aColor; attribute float aInt;
uniform float uScale;
varying vec3 vC; varying float vI;
void main(){
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = min(70.0, aSize * uScale / max(1.5, -mv.z));
  vC = aColor; vI = aInt;
}`;
const CLOUD_FRAG = `
precision highp float;
uniform float uCrisp;
varying vec3 vC; varying float vI;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r = length(d) * 2.0;
  if (r > 1.0) discard;
  float soft = pow(max(0.0, 1.0 - r), 2.0)
             + pow(max(0.0, 1.0 - r), 12.0) * 1.6;
  // Information-bearing note heads use a flat, antialiased disc with a
  // narrow hot centre. Other particle systems keep the atmospheric falloff.
  float edge = 1.0 - smoothstep(0.72, 1.0, r);
  float core = 1.0 - smoothstep(0.18, 0.46, r);
  float crisp = edge * 0.48 + core * 1.52;
  float a = mix(soft, crisp, uCrisp);
  gl_FragColor = vec4(vC * a * vI, 1.0);
}`;

// Every beam and every point is sized in PIXELS, which means the picture gets
// finer and dimmer as the render gets bigger — a 1080p master looked like a
// thinner, weaker version of the 480p draft rather than a sharper one, and
// background players fell under the bloom threshold and vanished. Widths are
// now scaled sub-linearly with frame height. A 1080p beam is deliberately
// thicker in pixels than a 480p beam, so it survives motion integration, but
// not 2.25x thicker: that simply recreated a 480p-sized blur at 1080p.
// 480 is the reference because that is the draft everything was judged
// against; the exponent makes 1080p about 1.56x thicker in pixels.
const BEAM_REF = 480;
let RES_SCALE = 1;
function beamScale(h) { return Math.pow(Math.max(1, h) / BEAM_REF, 0.55); }
const ALL_BEAMS = [];       // every Laser and Cloud, so widths can be rescaled
function applyResScale() {
  for (const b of ALL_BEAMS) {
    if (b.mat.uniforms.uWidth) b.mat.uniforms.uWidth.value = b.baseWidth * RES_SCALE;
    else if (b.mat.uniforms.uScale) b.mat.uniforms.uScale.value = b.baseWidth * RES_SCALE;
  }
}

class Cloud {
  constructor(n, scale = 900) {
    this.n = n;
    this.pos = new Float32Array(n * 3);
    this.col = new Float32Array(n * 3);
    this.size = new Float32Array(n);
    this.int = new Float32Array(n);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
    g.setAttribute('aInt', new THREE.BufferAttribute(this.int, 1));
    g.setDrawRange(0, 0);
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      vertexShader: CLOUD_VERT, fragmentShader: CLOUD_FRAG,
      uniforms: {uScale: {value: scale}, uCrisp: {value: 0}},
      transparent: true, blending: THREE.AdditiveBlending,
      depthTest: false, depthWrite: false});
    this.mesh = new THREE.Points(g, this.mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 3;
    scene.add(this.mesh);
    this.baseWidth = scale; ALL_BEAMS.push(this);
  }
  commit(k) {
    this.geo.setDrawRange(0, k);
    for (const a of ['position', 'aColor', 'aSize', 'aInt'])
      this.geo.getAttribute(a).needsUpdate = true;
  }
}

class Laser {
  constructor(maxPts, width = 2.4) {
    this.max = maxPts;
    const n = maxPts * 2;
    const g = new THREE.BufferGeometry();
    this.pos  = new Float32Array(n * 3);
    this.prev = new Float32Array(n * 3);
    this.next = new Float32Array(n * 3);
    this.col  = new Float32Array(n * 3);
    this.int  = new Float32Array(n);
    const side = new Float32Array(n);
    for (let i = 0; i < maxPts; i++) { side[i * 2] = -1; side[i * 2 + 1] = 1; }
    const idx = new Uint32Array((maxPts - 1) * 6);
    for (let i = 0, k = 0; i < maxPts - 1; i++) {
      const a = i * 2;
      idx[k++] = a; idx[k++] = a + 1; idx[k++] = a + 2;
      idx[k++] = a + 1; idx[k++] = a + 3; idx[k++] = a + 2;
    }
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('aPrev',    new THREE.BufferAttribute(this.prev, 3));
    g.setAttribute('aNext',    new THREE.BufferAttribute(this.next, 3));
    g.setAttribute('aColor',   new THREE.BufferAttribute(this.col, 3));
    g.setAttribute('aInt',     new THREE.BufferAttribute(this.int, 1));
    g.setAttribute('aSide',    new THREE.BufferAttribute(side, 1));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.setDrawRange(0, 0);
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      vertexShader: LINE_VERT, fragmentShader: LINE_FRAG,
      uniforms: {
        uRes:   {value: new THREE.Vector2(innerWidth, innerHeight)},
        uWidth: {value: width}, uBoost: {value: 1}, uAlpha: {value: 1},
        uFloor: {value: 0.35},
      },
      transparent: true, blending: THREE.AdditiveBlending,
      depthTest: false, depthWrite: false,
      // A beam is a ribbon of quads whose winding follows the path, so a
      // closed figure ends up entirely back-facing and gets culled away.
      // Nothing about a beam has a back, so: draw both sides.
      side: THREE.DoubleSide,
    });
    this.mesh = new THREE.Mesh(g, this.mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 2;
    this.baseWidth = width; ALL_BEAMS.push(this);
  }

  // pts: Float32Array of m*3 ; cols: m*3 ; ints: m ; closed: wrap the ends
  set(pts, cols, ints, m, closed) {
    const P = this.pos, R = this.prev, N = this.next, C = this.col, I = this.int;
    for (let i = 0; i < m; i++) {
      const p = i * 3, a = i * 6;
      const jp = closed ? (i - 1 + m) % m : Math.max(0, i - 1);
      const jn = closed ? (i + 1) % m     : Math.min(m - 1, i + 1);
      for (let k = 0; k < 3; k++) {
        const v = pts[p + k], vp = pts[jp * 3 + k], vn = pts[jn * 3 + k];
        P[a + k] = v;      P[a + 3 + k] = v;
        R[a + k] = vp;     R[a + 3 + k] = vp;
        N[a + k] = vn;     N[a + 3 + k] = vn;
        C[a + k] = cols[p + k]; C[a + 3 + k] = cols[p + k];
      }
      I[i * 2] = I[i * 2 + 1] = ints[i];
    }
    this.geo.setDrawRange(0, (m - 1) * 6);
    for (const k of ['position', 'aPrev', 'aNext', 'aColor', 'aInt'])
      this.geo.getAttribute(k).needsUpdate = true;
  }
  copyFrom(o, m) {                       // for ghosts: snapshot, no recompute
    this.pos.set(o.pos.subarray(0, m * 6));
    this.prev.set(o.prev.subarray(0, m * 6));
    this.next.set(o.next.subarray(0, m * 6));
    this.col.set(o.col.subarray(0, m * 6));
    this.int.set(o.int.subarray(0, m * 2));
    this.geo.setDrawRange(0, (m - 1) * 6);
    for (const k of ['position', 'aPrev', 'aNext', 'aColor', 'aInt'])
      this.geo.getAttribute(k).needsUpdate = true;
  }
}

// ── figure families ────────────────────────────────────────────────────────
// Each fills a Float32Array with m points. They are written to be smooth
// functions of their arguments, because the actor RELAXES toward its target
// shape rather than snapping — see Actor.step. That is what lets the torus
// knot change its winding number without popping.

function figLissajous(out, m, s, t, A) {
  // bass: slow, deep, three-axis. The ratios drift with how much is playing,
  // so a busier bass line genuinely produces a more knotted figure.
  const a = 3, b = 2 + s.poly * 0.5, c = 5 + s.density * 2.0;
  for (let i = 0; i < m; i++) {
    const u = i / m, ang = u * TAU;
    out[i * 3]     = Math.sin(a * ang + t * 0.13);
    out[i * 3 + 1] = Math.sin(b * ang + 1.1);
    out[i * 3 + 2] = Math.sin(c * ang + t * 0.09) * 0.75;
  }
}

function figKnot(out, m, s, t, A) {
  // sustained harmonic material: a (p,q) torus knot. q rides note density —
  // the figure gets more lobes exactly when the part gets busier.
  const p = 2 + Math.round(s.poly * 0.4), q = 3 + s.density * 4.0;
  for (let i = 0; i < m; i++) {
    const u = i / m, ang = u * TAU;
    const r = 1.0 + 0.44 * Math.cos(q * ang);
    out[i * 3]     = r * Math.cos(p * ang + t * 0.05);
    out[i * 3 + 1] = r * Math.sin(p * ang + t * 0.05);
    out[i * 3 + 2] = 0.50 * Math.sin(q * ang);
  }
}

function figRibbon(out, m, s, t, A) {
  const act = A.spec;
  // a voice, drawn: arc length IS time. The right-hand end is now, the left
  // is 2.6 seconds ago. Height is loudness, depth is brightness — so you can
  // literally read the phrase that just went past.
  const SPAN = 2.6;
  for (let i = 0; i < m; i++) {
    const u = i / (m - 1);
    const tt = t - (1 - u) * SPAN;
    const a = at(act.amp, tt), c = at(act.centroid, tt, 0.5);
    const tw = u * TAU * (0.35 + s.tilt * 0.6);
    const y = (0.15 + a * 1.35), z = (c - 0.5) * 1.7;
    out[i * 3]     = (u - 0.5) * 3.4;
    out[i * 3 + 1] = y * Math.cos(tw) - z * Math.sin(tw);
    out[i * 3 + 2] = y * Math.sin(tw) + z * Math.cos(tw);
  }
}

function figComb(out, m, s, t, A) {
  const bands = A.bands;
  // non-pitched percussion: a vector-scope bar rack. The beam runs up each
  // band, back down, and along the base to the next — one continuous path,
  // which is how an actual laser would have to draw a bar chart.
  const nb = bands.length, per = Math.max(4, Math.floor(m / nb));
  let i = 0;
  for (let b = 0; b < nb && i < m; b++) {
    const x = (b / (nb - 1) - 0.5) * 4.6;
    const h = 0.10 + bands[b] * 1.15;
    for (let k = 0; k < per && i < m; k++, i++) {
      const f = k / (per - 1);
      // up, over, down: a narrow hairpin
      const up = f < 0.42 ? f / 0.42 : f < 0.58 ? 1 : (1 - f) / 0.42;
      out[i * 3]     = x + (f < 0.42 ? -0.055 : f < 0.58 ? (f - 0.5) * 0.7 : 0.055);
      out[i * 3 + 1] = -1.1 + h * clamp(up, 0, 1);
      out[i * 3 + 2] = 0;
    }
  }
  for (; i < m; i++) { out[i * 3] = out[(i - 1) * 3]; out[i * 3 + 1] = out[(i - 1) * 3 + 1]; out[i * 3 + 2] = 0; }
}

function figMouth(out, m, s, t, A) {
  // The lead vocal begins with the upper lip. The lower lip, tongue, teeth,
  // eyes and occasional face are independent beams in FaceRig below, so the
  // mouth no longer reads as one circular loop.
  //
  //   the SHAPE it is trying to make — open, wide, round, teeth, straight off
  //   the spelling of the word being sung, smoothed so it has mass;
  //
  //   and on top of that, the finer distortion that the actual SOUND is doing
  //   to it — the six-band displacement every figure gets, plus a fast ripple
  //   on spectral flux, which is what stops a puppet reading as a puppet.
  //
  // It is not a phonetic transcription and should not be read as one. It is
  // right often enough, at the speed it happens, to look like singing.
  const op = at(D.mouth.open, t, 0.1), wd = at(D.mouth.wide, t, 0.5);
  const rd = at(D.mouth.round, t, 0.2), th = at(D.mouth.teeth, t, 0);
  const face = A.faceE || 0;
  const carrier = vocalWave(t);
  const W = (1.02 + 0.54 * wd) * (1 - 0.30 * rd) * lerp(1, 0.58, face)
          * (1 + carrier * VOCAL_GAIN * (0.012 + 0.018 * s.amp));
  const H = (0.045 + 0.92 * op * (1 + 0.20 * rd)) * lerp(1, 0.72, face)
          * (1 + carrier * VOCAL_GAIN * (0.026 + 0.030 * s.amp));
  const y0 = -0.48 * face;
  for (let i = 0; i < m; i++) {
    const u = i / (m - 1), q = u * 2 - 1;
    const arch = Math.pow(Math.max(0, 1 - q * q), 0.72);
    // A restrained cupid's bow: a central notch with two soft peaks. It is
    // clearest on wide vowels and relaxes toward a simple arc when rounded.
    const notch = -0.13 * Math.exp(-(q * q) / 0.020);
    const peaks = 0.075 * (Math.exp(-((q - 0.24) ** 2) / 0.025)
                         + Math.exp(-((q + 0.24) ** 2) / 0.025));
    // Read a 12.6 ms sliver of the real signal across the lip. That turns
    // pitch-period detail into a fine spatial ripple while the centre sample
    // above supplies coherent width/height breathing.
    const grain = vocalWave(t + q * 0.0063);
    const fine = VOCAL_GAIN * (0.016 + 0.030 * s.amp + 0.012 * s.flux)
               * grain * Math.pow(arch, 0.45);
    const x = W * q;
    const y = y0 + 0.018 + H * (arch + (notch + peaks) * (1 - rd)) + fine;
    out[i * 3] = x;
    out[i * 3 + 1] = y;
    out[i * 3 + 2] = 0.05 + th * 0.035 + 0.035 * Math.sin(u * Math.PI)
                   + fine * 0.62;
  }
}

function figChord(out, m, s, t, A) {
  // A MIDI part: a harmonic rose. Every sounding note adds one cosine term
  // whose lobe count is its interval above the bass, weighted by velocity —
  // so a fifth adds 9 lobes, an octave adds 2, and a major triad has a
  // signature you learn to recognise. Change the voicing and the figure
  // changes shape; hold the same chord and it sits perfectly still. Nothing
  // sounding relaxes it back to a plain ring.
  const live = A.live;
  let bass = 127;
  for (const n of live) bass = Math.min(bass, n[0]);
  let w = 1e-6;
  const terms = [];
  // youngest note first — the newest arrival gets to shout loudest
  let fresh = 0;
  for (const [pit, vel, age] of live) {
    const iv = (((pit - bass) % 12) + 12) % 12;
    const kick = Math.exp(-age / 0.13);            // this note, just struck
    terms.push([2 + iv, vel * (1 + 2.2 * kick), (pit - bass) / 12, kick]);
    w += vel * (1 + 2.2 * kick);
    if (kick > fresh) fresh = kick;
  }
  A.hit = fresh;
  // the whole figure rolls, faster when the part is busy — a still rose reads
  // as a diagram, a turning one reads as an instrument being played
  const spin = t * (0.10 + 0.85 * clamp(s.density, 0, 1));
  const punch = 1 + 0.55 * fresh;
  for (let i = 0; i < m; i++) {
    const u = i / m, ang = u * TAU + spin;
    let r = 1.0, z = 0.26 * Math.sin(3 * ang + t * 0.19);
    for (const [nl, v, oct, kick] of terms) {
      const g = v / w;
      r += 0.70 * g * Math.cos(nl * ang + oct * 1.25);
      z += 0.48 * g * Math.sin((nl + 1) * ang + oct);
      // a struck note throws a sharp spur out of the rose at its own angle
      if (kick > 0.02) {
        const lobe = Math.cos(nl * ang + oct * 1.25);
        r += 0.55 * kick * g * Math.pow(Math.max(0, lobe), 9.0);
      }
    }
    out[i * 3]     = r * punch * Math.cos(ang - spin);
    out[i * 3 + 1] = r * punch * Math.sin(ang - spin);
    out[i * 3 + 2] = z * punch;
  }
}

const FIGURES = {lissajous: figLissajous, knot: figKnot, ribbon: figRibbon,
                 comb: figComb, chord: figChord, mouth: figMouth};
const CLOSED  = {lissajous: true, knot: true, ribbon: false, comb: false,
                 chord: true, mouth: false};
const NPTS    = {lissajous: 400, knot: 460, ribbon: 300, comb: 300,
                 chord: 520, mouth: 380};
// natural size of each family, so a Lissajous and a torus knot arrive on the
// stage at comparable scale instead of the bass eating the frame
const FSCALE  = {lissajous: 0.60, knot: 0.86, ribbon: 0.78, comb: 1.00,
                 chord: 0.50, mouth: 1.05};
// how much of the six-band displacement each family takes. A mouth needs only
// a tremor; at full strength the spectrum turns it into a gear wheel.
const FDISP   = {lissajous: 1.0, knot: 1.0, ribbon: 1.0, comb: 1.0,
                 chord: 1.0, mouth: 0.30};

// How big a player is, by where they are billed. Piecewise so the tiers are
// legible numbers you can argue with, rather than the output of a formula:
//   0 = lead, 1 = support, 2.5 = background, 3.4 = off
const BILL_STOPS = [[0, 1.55], [1, 0.55], [2.5, 0.24], [3.4, 0.16]];
function billCurve(b) {
  for (let i = 0; i < BILL_STOPS.length - 1; i++) {
    const [x0, y0] = BILL_STOPS[i], [x1, y1] = BILL_STOPS[i + 1];
    if (b <= x1) {
      const f = clamp((b - x0) / (x1 - x0), 0, 1);
      return y0 + (y1 - y0) * f;
    }
  }
  return BILL_STOPS[BILL_STOPS.length - 1][1];
}

// ── entrances ────────────────────────────────────────────────────────────
// One per archetype. Each returns [dx, dy, dz, scale] for a player who is
// `v` of the way off stage — 0 settled, 1 gone. They are meant to read as
// the same gesture the section's introduction makes, so an arrival in a
// chorus feels like a chorus and an arrival in the turn feels like the turn.
const ENTRANCE = {
  // rises out of the floor, unhurried
  emerge:  (v, i) => [0, -7.0 * v * v, 0, 1 - 0.35 * v],
  // slides in from the side it will leave by
  drive:   (v, i) => [(i % 2 ? 1 : -1) * 13.0 * v * v, 0, 0, 1 - 0.2 * v],
  // opens out of nothing at its own position
  bloom:   (v) => [0, 0, 0, Math.max(0.001, 1 - v) ** 1.6],
  // drifts back into the dark
  hold:    (v) => [0, 0.8 * v, -16.0 * v * v, 1 - 0.3 * v],
  // thrown in from above, fast
  surge:   (v, i) => [0, 9.0 * v * v, -3.0 * v, 1 + 0.4 * v * (1 - v) * 4],
  // snaps: no travel, it is simply not there, with a stutter on the way
  rupture: (v, i, t) => [Math.sin(t * 47 + i) * 1.6 * v, 0, 0,
                         Math.max(0.001, 1 - v) * (v > 0.5 ? 0.2 : 1)],
  // comes apart on the spot
  scatter: (v, i, t) => [Math.sin(t * 3 + i) * 5.0 * v, Math.cos(t * 2.3 + i) * 4.0 * v,
                         0, 1 - 0.6 * v],
};

// ── palette ────────────────────────────────────────────────────────────────
// Laser hues: saturated, high-value, and spaced far enough apart that two
// beams crossing still read as two beams.
const HUES = [0.030, 0.545, 0.905, 0.135, 0.760, 0.455, 0.640, 0.080];
const tmpC = new THREE.Color();
function hueRGB(h, s, v, o, i) {
  tmpC.setHSL(((h % 1) + 1) % 1, s, v);
  o[i] = tmpC.r; o[i + 1] = tmpC.g; o[i + 2] = tmpC.b;
}

// ── the vocalist's expression rig ─────────────────────────────────────────
// These are still laser paths, not an illustrated overlay. The mouth carries
// the phonemes; two upper-lash strokes are the entire suggestion of a face.
// Their spacing and attitude can resolve around the mouth or come loose as
// independent marks. No outline, nose, brows or pupils are needed.
class FacePart {
  constructor(group, n, width = 2.8) {
    this.n = n;
    this.pts = new Float32Array(n * 3);
    this.cols = new Float32Array(n * 3);
    this.ints = new Float32Array(n);
    this.line = new Laser(n, width);
    this.line.mat.uniforms.uFloor.value = 0.10;
    this.line.mesh.visible = false;
    group.add(this.line.mesh);
  }
  draw(hue, sat, val, intensity, alpha) {
    this.line.mesh.visible = alpha > 0.004;
    if (!this.line.mesh.visible) return;
    tmpC.setHSL(((hue % 1) + 1) % 1, sat, val);
    for (let i = 0; i < this.n; i++) {
      this.cols[i * 3] = tmpC.r;
      this.cols[i * 3 + 1] = tmpC.g;
      this.cols[i * 3 + 2] = tmpC.b;
      this.ints[i] = intensity;
    }
    this.line.set(this.pts, this.cols, this.ints, this.n, false);
    this.line.mat.uniforms.uAlpha.value = alpha;
  }
}

class FaceRig {
  constructor(actor) {
    this.actor = actor;
    const g = actor.group;
    this.lower = new FacePart(g, 260, 3.4);
    this.teeth = new FacePart(g, 120, 2.1);
    this.tongue = new FacePart(g, 130, 2.8);
    this.eyeL = new FacePart(g, 100, 3.0);
    this.eyeR = new FacePart(g, 100, 3.0);
    this.parts = [this.lower, this.teeth, this.tongue,
      this.eyeL, this.eyeR];
  }

  setRes(w, h) {
    for (const p of this.parts) p.line.mat.uniforms.uRes.value.set(w, h);
  }

  update(t, s, P, alpha) {
    const A = this.actor;
    const lipAlpha = alpha * (0.025 + 0.975 * clamp(A.voiceE || 0, 0, 1));
    const op = at(D.mouth.open, t, 0.06), wd = at(D.mouth.wide, t, 0.5);
    const rd = at(D.mouth.round, t, 0.2), th = at(D.mouth.teeth, t, 0);
    const tongue = at(D.mouth.tongue, t, 0);
    const tonguePos = at(D.mouth.tongue_pos, t, 0);
    const face = A.faceE || 0;
    const carrier = vocalWave(t);
    const W = (1.02 + 0.54 * wd) * (1 - 0.30 * rd) * lerp(1, 0.58, face)
            * (1 + carrier * VOCAL_GAIN * (0.012 + 0.018 * s.amp));
    const H = (0.045 + 0.92 * op * (1 + 0.20 * rd)) * lerp(1, 0.72, face)
            * (1 + carrier * VOCAL_GAIN * (0.026 + 0.030 * s.amp));
    const y0 = -0.48 * face;
    const sat = Math.min(0.88, (P.sat ?? 0.72) + 0.05);
    const val = Math.max(0.52, P.val ?? 0.55);
    const voiceBeam = 0.72 + 0.34 * s.amp + 0.34 * s.attack;

    // Lower vermilion border: fuller and slightly deeper than the upper lip.
    for (let i = 0; i < this.lower.n; i++) {
      const u = i / (this.lower.n - 1), q = u * 2 - 1;
      const arch = Math.pow(Math.max(0, 1 - q * q), 0.66);
      const grain = vocalWave(t - q * 0.0063 + 0.0014);
      const fine = VOCAL_GAIN * (0.016 + 0.030 * s.amp + 0.012 * s.flux)
                 * grain * Math.pow(arch, 0.45);
      this.lower.pts[i * 3] = W * q;
      this.lower.pts[i * 3 + 1] = y0 - 0.018
                                - H * arch * (1.04 + 0.13 * (1 - q * q))
                                - fine;
      this.lower.pts[i * 3 + 2] = 0.08 + 0.055 * arch + fine * 0.58;
    }
    this.lower.draw(A.hue + 0.012, sat, val, voiceBeam, lipAlpha * 0.96);

    // A narrow upper dental edge. It is strongest for f/v/th/s/z but follows
    // the existing continuous teeth control rather than switching by letter.
    for (let i = 0; i < this.teeth.n; i++) {
      const u = i / (this.teeth.n - 1), q = u * 2 - 1;
      this.teeth.pts[i * 3] = W * 0.68 * q;
      this.teeth.pts[i * 3 + 1] = y0 + H * 0.34 * (1 - q * q) - 0.006;
      this.teeth.pts[i * 3 + 2] = 0.17;
    }
    const teethE = th * clamp((op + 0.10) / 0.35, 0, 1);
    this.teeth.draw(A.hue + 0.12, 0.28, 0.72, 0.90,
                    lipAlpha * teethE * 0.72);

    // Tongue gesture. Front/dental articulations rise toward the lip plane;
    // velars stay lower and farther back. A lightly pointed upper half makes
    // /th/ and /l/ read as a tip rather than another ellipse.
    const tongueCarrier = vocalWave(t + 0.0022);
    const trx = W * (0.23 + 0.13 * tongue) * (1 - 0.14 * rd)
              * (1 + tongueCarrier * VOCAL_GAIN * 0.014);
    const try_ = Math.max(0.028, H * (0.11 + 0.20 * tongue)
                                 * (1 + tongueCarrier * VOCAL_GAIN * 0.030));
    const tcy = y0 - H * 0.24 + H * 0.30 * Math.max(0, tonguePos);
    for (let i = 0; i < this.tongue.n; i++) {
      const u = i / (this.tongue.n - 1), a = u * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      const tip = Math.max(0, sa) * Math.max(0, tonguePos) * tongue * 0.16;
      this.tongue.pts[i * 3] = trx * ca;
      this.tongue.pts[i * 3 + 1] = tcy + try_ * sa + tip;
      this.tongue.pts[i * 3 + 2] = 0.09 + 0.18 * Math.max(0, tonguePos)
                                 - 0.10 * Math.max(0, -tonguePos);
    }
    const tongueE = tongue * clamp((op - 0.055) / 0.28, 0, 1);
    this.tongue.draw(0.96, 0.82, val * 0.96, 0.86,
                     lipAlpha * tongueE * 0.86);

    // The eyes are only upper lids with three outer lashes. Their angle,
    // distance and closure do the expressive work that pupils and brows would
    // ordinarily do. A strong attack briefly squints them; spectral direction
    // shifts and cants the whole pair so they can look without literal irises.
    const eyes = A.eyeE || 0;
    const blink = clamp((s.attack - 0.58) * 1.75, 0, 0.88);
    const resolve = smooth(clamp(face, 0, 1));
    const loose = clamp(eyes * (1 - resolve), 0, 1);
    const gazeX = clamp(s.tilt * 0.11, -0.12, 0.12);
    const gazeY = clamp((s.centroid - 0.5) * 0.18, -0.10, 0.10);
    const ex = 0.59 + loose * 0.045;
    const ey = 0.76 + face * 0.08 + gazeY;
    const erx = 0.38;
    const lid = 0.135 * (1 - blink) + 0.020;
    const lash = 0.115 * (0.84 + 0.16 * (1 - blink));
    const commonTilt = clamp(s.tilt * 0.16 + (s.centroid - 0.5) * 0.08,
                             -0.18, 0.18);
    // Inner corner, lid arch, then three clean outer-lash flicks. Sampling a
    // small designed set of knots keeps the silhouette intentional instead of
    // turning it into another spectral loop.
    const knots = [
      [-1.00, 0], [-0.56, lid * 0.78], [0, lid], [0.48, lid * 0.72],
      [0.72, lid * 0.38], [0.84, lid * 0.32 + lash],
      [0.78, lid * 0.18], [1.00, lid * 0.20 + lash * 0.82],
      [0.88, lid * 0.08], [1.16, lash * 0.50],
    ];
    for (const [part, side] of [[this.eyeL, -1], [this.eyeR, 1]]) {
      const phase = side < 0 ? 0.7 : 3.8;
      // While the portrait is unresolved the two marks dart on different
      // clocks and even occupy different depths. As faceE rises all offsets
      // converge smoothly, so the expression visibly assembles on the lyric.
      const cx = side * ex + gazeX
               + loose * (0.13 * Math.sin(t * 4.3 + phase)
                        + 0.045 * Math.sin(t * 11.7 + phase * 0.4));
      const cy = ey + loose * (0.11 * Math.sin(t * 3.1 + phase * 1.3)
                             + side * 0.035 * Math.sin(t * 7.9));
      const cz = 0.035 + loose * 0.22 * Math.sin(t * 2.7 + phase * 1.7);
      const rot = commonTilt
                + loose * (0.18 * Math.sin(t * 3.7 + phase)
                         + side * 0.08 * Math.sin(t * 8.2 + 0.4));
      const cr = Math.cos(rot), sr = Math.sin(rot);
      for (let i = 0; i < part.n; i++) {
        const v = i / (part.n - 1) * (knots.length - 1);
        const k = Math.min(knots.length - 2, Math.floor(v));
        const f = smooth(v - k);
        const q = lerp(knots[k][0], knots[k + 1][0], f);
        const yy = lerp(knots[k][1], knots[k + 1][1], f);
        const dx = side * erx * q, dy = yy;
        part.pts[i * 3] = cx + dx * cr - dy * sr;
        part.pts[i * 3 + 1] = cy + dx * sr + dy * cr;
        part.pts[i * 3 + 2] = cz + loose * side * q * 0.035;
      }
      part.draw(A.hue + 0.10, 0.52, val * 1.03, 0.88,
                alpha * eyes * 0.94);
    }
  }
}

// ── actors ─────────────────────────────────────────────────────────────────
const GHOSTS = 6;

class Actor {
  constructor(name, spec, hue, i, count) {
    this.name = name; this.spec = spec;
    this.fig = spec.figure; this.hue = hue;
    // the lead vocal is the one that sings words, so it gets the mouth
    if (/lead/i.test(name) && this.fig === 'ribbon' && D.mouth) this.fig = 'mouth';
    this.kind = spec.kind || 'audio';
    this.m = NPTS[this.fig] || 360;
    this.closed = CLOSED[this.fig];
    this.isKit = this.fig === 'comb';

    this.tgt = new Float32Array(this.m * 3);   // freshly computed shape
    this.cur = new Float32Array(this.m * 3);   // what is actually drawn
    this.cols = new Float32Array(this.m * 3);
    this.ints = new Float32Array(this.m);
    this.stops = new Float32Array(18);
    this.bands = new Float32Array(D.bands.length);

    this.group = new THREE.Group();
    this.line = new Laser(this.m, 3.4);
    this.group.add(this.line.mesh);
    // the haze: the same path, much wider and much dimmer. A send opening up
    // fades this in, so the beam softens into fog without losing its core.
    this.haze = new Laser(this.m, 20.0);
    this.haze.mat.uniforms.uAlpha.value = 0;
    this.group.add(this.haze.mesh);
    // ghosts: snapshots of the figure from the recent past. This is the
    // reverb made visible — Raum's decay sets how far back they reach.
    this.ghosts = [];
    for (let k = 0; k < GHOSTS; k++) {
      const g = new Laser(this.m, 2.8);
      g.mat.uniforms.uAlpha.value = 0;
      g.born = -1e9; g.live = false;
      this.ghosts.push(g); this.group.add(g.mesh);
    }
    this.gi = 0; this.lastGhost = -1e9;
    this.faceE = 0; this.eyeE = 0; this.voiceE = 0;
    this.faceRig = this.fig === 'mouth' ? new FaceRig(this) : null;
    this.presence = 0; this.onStage = false;
    // a zeroed state from the outset, so anything that reads an actor before
    // its first step gets numbers rather than a crash
    this.state = {amp: 0, centroid: 0.5, flux: 0, spread: 0.5, tilt: 0,
                  attack: 0, density: 0, poly: 0, ambitus: 0, meanpitch: 60};

    // where it stands: evenly around a ring, kit at the centre-back
    this.theta0 = (i / count) * TAU;
    this.slot = i;
    scene.add(this.group);

    // notes, for the travelling beads
    this.notes = spec.notes || [];
    this.noteT = this.notes.map(n => n[0]);
    this.live = [];
    this.pan = 0; this.send = 0; this.twist = 0;
  }

  // which notes are sounding right now
  liveNotes(t) {
    const out = [];
    if (!this.noteT.length) return out;
    let j = lowerBound(this.noteT, t - 8.0);
    while (j < this.notes.length && this.notes[j][0] <= t) {
      const [on, dur, pit, vel] = this.notes[j]; j++;
      if (t < on + dur) out.push([pit, vel, t - on, dur]);
    }
    return out;
  }

  // continuous state at time t
  read(t) {
    const s = {
      amp: at(this.spec.amp, t), centroid: at(this.spec.centroid, t, 0.5),
      flux: at(this.spec.flux, t), spread: at(this.spec.spread, t, 0.5),
      tilt: at(this.spec.tilt, t), attack: at(this.spec.attack, t),
      density: at(this.spec.density, t), poly: at(this.spec.poly, t),
      ambitus: at(this.spec.ambitus, t),
      meanpitch: at(this.spec.meanpitch, t, 60),
    };
    this.live = this.liveNotes(t);
    const nb = D.bands.length;
    if (this.kind === 'midi') {
      // a MIDI part has no spectrum, so build one from the register the notes
      // are actually in. Same six numbers, same downstream machinery — the
      // arc displacement then writes the VOICING along the path.
      // per SECOND, not per call: at 1920 calls a second this was collapsing
      // the MIDI spectrum to nothing, which is why the parts went faint in the
      // master and looked right in the draft
      const decay = Math.exp(-(this.lastDt || 1 / 60) / 0.055);
      for (let b = 0; b < nb; b++) this.bands[b] *= decay;
      for (const [pit, vel] of this.live) {
        const b = clamp(Math.floor((pit - 30) / 10), 0, nb - 1);
        this.bands[b] = Math.min(1.4, this.bands[b] + vel * 0.9);
      }
    } else {
      for (let b = 0; b < nb; b++)
        this.bands[b] = at(this.spec.bands[D.bands[b]], t) / 255;
    }
    return s;
  }

  // How much of the stage this actor currently has. Driven from the exported
  // salience, which already looks two seconds ahead — so an actor walks on
  // BEFORE its entry rather than after it, and the arrival lands with the
  // music. Attack is quick, release is slow, so nothing flickers.
  // `presence` is a DIMMER; being on the stage is a different question.
  // Conflating them is what emptied the cast: a background player sits at
  // presence 0.42 deliberately — small and quiet, but very much there — and
  // the entrance code read that as "58% of the way off stage" and parked them
  // fifteen units past the edge of frame at a twentieth of their size. The
  // plan was fine and they were all still being simulated; they were just in
  // the dark. So `stageIn` is 1 for ANY role and 0 only for genuinely gone,
  // with the silence gate folded in, and it alone drives entrances.
  focus(t, dt, wanted, onstage) {
    const k = 1 - Math.exp(-dt / (wanted > this.presence ? 0.40 : 0.75));
    this.presence += (wanted - this.presence) * k;
    if (this.stageIn === undefined) this.stageIn = onstage;
    const k2 = 1 - Math.exp(-dt / (onstage > this.stageIn ? 0.45 : 0.80));
    this.stageIn += (onstage - this.stageIn) * k2;
    // Snapping a dying value to zero is CLEANUP, and it must only apply to
    // something already heading there. Testing the value alone made it a
    // latch: at 32x supersampling one step raises presence by 0.0013, which is
    // below the 0.004 floor, so it was zeroed again every step and could never
    // rise. At draft settings a step raises it by 0.05 and it escapes on the
    // first frame — which is why the low-fi renders looked right and the
    // master had one actor. Gate the cleanup on the TARGET being zero too.
    if (wanted <= 0.001 && onstage <= 0.001
        && this.presence < 0.004 && (this.stageIn ?? 0) < 0.01) {
      this.presence = 0; this.stageIn = 0;
      if (this.onStage) {           // re-adopt its shape when it returns
        this.onStage = false; this.primed = false; this.hierPrimed = false;
        for (const g of this.ghosts) g.live = false;
      }
      this.group.visible = false;
    } else {
      this.onStage = true;
      this.group.visible = true;
    }
    return this.presence;
  }

  step(t, dt, P) {
    this.lastDt = dt;
    const s = this.read(t);
    this.state = s;
    if (this.faceRig) {
      // The phoneme curves describe articulation, but the real aligned stem
      // decides whether anybody is actually singing.  A quick release makes
      // phrase-end silence legible; a softer attack keeps consonants from
      // making the entire portrait pop.
      const voiceTarget = smooth(clamp((s.amp - 0.035) / 0.34, 0, 1));
      const kv = 1 - Math.exp(-dt / (voiceTarget > this.voiceE ? 0.075 : 0.16));
      this.voiceE += (voiceTarget - this.voiceE) * kv;
      const leadness = clamp(1.45 - (this.bill ?? 2.5), 0, 1);
      const faceTarget = faceCueAt(t) * leadness * clamp(this.presence * 1.4, 0, 1);
      const eyeTarget = Math.max(faceTarget, this.attention || 0,
        clamp((s.attack - 0.58) * 1.7, 0, 1) * leadness);
      const kf = 1 - Math.exp(-dt / (faceTarget > this.faceE ? 0.13 : 0.38));
      const ke = 1 - Math.exp(-dt / (eyeTarget > this.eyeE ? 0.10 : 0.48));
      this.faceE += (faceTarget - this.faceE) * kf;
      this.eyeE += (eyeTarget - this.eyeE) * ke;
    }
    const fn = FIGURES[this.fig];
    fn(this.tgt, this.m, s, t, this);

    // ── the spectrum, written along the arc ──────────────────────────────
    // This is the rose's information — where the energy sits, not how much —
    // but unrolled onto the path instead of filled into a disc. Bass at one
    // end of the arc, air at the other, mirrored so a closed figure joins up.
    const nb = D.bands.length;
    let mx = 1e-6;
    for (let b = 0; b < nb; b++) mx = Math.max(mx, this.bands[b]);
    const prof = [];
    for (let b = 0; b < nb; b++) prof.push(Math.max(0.03, Math.pow(this.bands[b] / mx, P.gamma)));

    const disp = 0.60 * P.gamma * (0.35 + 0.9 * s.amp) * (FDISP[this.fig] ?? 1);
    const wob = s.flux * 0.16 * (FDISP[this.fig] ?? 1);
    for (let i = 0; i < this.m; i++) {
      const u = i / this.m;
      const f = Math.abs(((u * 2) % 2) - 1);         // 0..1..0 around the loop
      const x = f * (nb - 1), b = Math.min(nb - 2, x | 0), g = smooth(x - b);
      const v = prof[b] * (1 - g) + prof[b + 1] * g;
      const k = 1 + disp * v + wob * Math.sin(37 * u * TAU + t * 9.0);
      if (this.closed) {
        this.tgt[i * 3] *= k; this.tgt[i * 3 + 1] *= k; this.tgt[i * 3 + 2] *= k;
      } else {
        // x is the time axis on an open figure — leave it alone
        this.tgt[i * 3 + 1] *= k; this.tgt[i * 3 + 2] *= k;
      }
    }

    // ── the outro scatter ──
    // Applied to the TARGET, not accumulated onto the relaxed position. Adding
    // it to `cur` every call meant the collapse was forty times more violent
    // at 32x supersampling than at draft settings.
    if (SHOW.tear > 0.001) {
      const push = SHOW.tear * SHOW.tear * 9.0;
      for (let i = 0; i < this.m; i++) {
        const u = i / this.m, a2 = u * TAU * 3.7 + this.slot;
        this.tgt[i * 3]     += Math.cos(a2) * push * (0.3 + u);
        this.tgt[i * 3 + 1] += Math.sin(a2 * 1.3) * push * (0.3 + u);
        this.tgt[i * 3 + 2] += Math.sin(a2 * 0.7) * push * 0.6;
      }
    }

    // ── relax toward the target ──────────────────────────────────────────
    // First touch: adopt the target outright. Without this the figure starts
    // collapsed at the origin and spends its first fraction of a second as a
    // knot of overlapping quads — invisible live, but an offline render that
    // starts mid-song would capture exactly that.
    if (!this.primed) { this.cur.set(this.tgt); this.primed = true; }
    // Frame-rate independent, so the offline supersampled render and live
    // playback settle identically. This is also what makes a change of
    // winding number a morph instead of a pop.
    // The exported phoneme curves already have physical smoothing. Let the
    // vocalist adopt each target directly so the 55–280 Hz signal riding on
    // the lip is not accidentally low-passed back into an envelope here.
    const kk = this.faceRig ? 1 : 1 - Math.exp(-dt / 0.055);
    for (let i = 0; i < this.m * 3; i++)
      this.cur[i] += (this.tgt[i] - this.cur[i]) * kk;

    // ── colour and per-vertex intensity ─────────────────────────────────
    // hue is the section's, not the actor's: the cast recolours at a boundary
    const HH = P.hues || [this.hue];
    this.hue = HH[this.slot % HH.length];
    const hueShift = (s.centroid - 0.5) * 0.10 + this.twist * 0.04;
    const base = (this.kind === 'midi' ? 0.22 : 0.55)
               + 0.36 * s.amp + 0.42 * s.attack
               + (this.isKit ? 0.24 * s.attack : 0);
    const sat = (P.sat ?? 0.72) - 0.25 * s.attack;
    const STOPS = 5;
    for (let q = 0; q <= STOPS; q++)
      hueRGB(this.hue + hueShift + (q / STOPS - 0.5) * 0.05 * s.spread,
             sat, P.val ?? 0.55, this.stops, q * 3);
    const C = this.cols, S = this.stops, I = this.ints, B = this.bands;
    for (let i = 0; i < this.m; i++) {
      const u = i / this.m;
      const x = u * STOPS, q = Math.min(STOPS - 1, x | 0), g2 = x - q;
      const o = q * 3, o2 = o + 3, c3 = i * 3;
      C[c3]     = S[o]     + (S[o2]     - S[o])     * g2;
      C[c3 + 1] = S[o + 1] + (S[o2 + 1] - S[o + 1]) * g2;
      C[c3 + 2] = S[o + 2] + (S[o2 + 2] - S[o + 2]) * g2;
      const bi = (Math.abs(((u * 2) % 2) - 1) * (nb - 1)) | 0;
      I[i] = base * (0.55 + 0.45 * Math.sqrt(B[bi < nb ? bi : nb - 1]));
    }

    // ── note beads ──────────────────────────────────────────────────────
    // Each sounding note puts a bright bead on the path and walks it from one
    // end to the other over the note's length. This is the only element that
    // is strictly per-event, and it is what makes the figure feel PLAYED.
    if (this.noteT.length) {
      let j = lowerBound(this.noteT, t - 3.2);
      while (j < this.notes.length && this.notes[j][0] <= t) {
        const [on, dur, pitch, vel] = this.notes[j]; j++;
        const age = t - on;
        if (age > dur + 0.25) continue;
        const ub = clamp(age / Math.max(0.12, dur), 0, 1.15);
        const wid = 26 + 40 * (1 - clamp(age / 0.4, 0, 1));
        const gain = vel * P.notes * (1 - clamp((age - dur) / 0.25, 0, 1));
        for (let i = 0; i < this.m; i++) {
          let d = Math.abs(i / this.m - ub);
          if (this.closed) d = Math.min(d, 1 - d);
          const e = Math.exp(-(d * wid) * (d * wid));
          if (e > 0.002) this.ints[i] += e * gain * 2.4;
        }
      }
      // A dense MIDI part can have a dozen beads overlapping the same stretch
      // of curve. Unclamped they sum into a white hole that the bloom then
      // spreads over a third of the frame, and the figure disappears inside
      // its own highlight. Cap it: beams may be hot, not blank.
      const CAP = this.kind === 'midi' ? 1.7 : 2.3;
      for (let i = 0; i < this.m; i++)
        if (this.ints[i] > CAP) this.ints[i] = CAP;
    }

    // ── placement: a hierarchy, not a democracy ─────────────────────────
    // Whoever has the stage stands near the middle and is large. Second is
    // off to one side and smaller. Anyone else is far back and small enough
    // to read as context rather than as a competing subject. `bill` is the
    // billing order, eased, so a change of lead is a move rather than a cut.
    // A ring in the horizontal plane only ever uses the middle band of the
    // frame. This is a 2:3 Lissajous instead, so an actor's path covers the
    // full width AND height over its cycle, with the period locked to eight
    // bars and a slower wobble on top so successive passes do not repeat.
    const ph = this.theta0;
    const w = t / BAR8 * TAU;
    const swing = 0.32 * Math.sin(w * 0.25 + ph * 1.7);   // the slow wobble
    // ── how they come and go ──
    // An entrance is a piece of staging, and it should mean the same thing
    // the section means. `travel` is 0 while a player is settled and 1 while
    // they are arriving or leaving; the archetype decides which way they move
    // through that.
    // the kit is the room, not a player: it never walks on or off
    const travel = this.isKit ? 0 : 1 - clamp(this.stageIn ?? 1, 0, 1);
    const MOVE = ENTRANCE[P.arch] || ENTRANCE.drive;
    // billing: 0 = lead, 1 = support, 2+ = background
    const b = this.bill === undefined ? 2.5 : this.bill;
    const lead = clamp(1 - b, 0, 1);            // 1 when this actor is the lead
    const back = clamp(b - 1, 0, 1.6);
    // the lead barely wanders; everyone else keeps the wide tiled orbit, so
    // the frame has a still centre and movement around it
    const Rx = (0.9 + 4.6 * Math.min(1, b)) * P.spread;
    const Ry = (0.5 + 2.5 * Math.min(1, b)) * P.spread;
    const Rz = 0.8 + 2.9 * Math.min(1, b);
    const y0 = this.kind === 'midi' ? clamp((s.meanpitch - 58) * 0.05, -1.0, 1.2) : 0;
    const px = this.isKit ? 0
             : Rx * Math.sin(2 * w + ph) * (1 + swing * 0.5) * (1 + 0.52 * back);
    const py = this.isKit ? -2.20
             : y0 * (1 - lead) + 0.55 * lead
               + Ry * Math.sin(3 * w + ph * 1.7 + swing) * (1 + 0.42 * back);
    const pz = this.isKit ? 1.4
             : 1.6 * lead + Rz * Math.cos(w + ph * 0.6) - 5.2 * back;
    // the section's own way of walking someone on and off
    const ex = MOVE(travel, this.slot, t);
    if (this.px === undefined) { this.px = px; this.py = py; this.pz = pz; }
    const ke = 1 - Math.exp(-dt / 0.18);
    this.px += (px - this.px) * ke;
    this.py += (py - this.py) * ke;
    this.pz += (pz - this.pz) * ke;
    this.group.position.set(this.px + this.pan * 1.2 + ex[0],
                            this.py + ex[1], this.pz + ex[2]);
    this.group.rotation.y = -Math.atan2(this.px, this.pz + 9) + this.twist * 0.25;
    this.group.rotation.z = this.twist * 0.18 + this.state.tilt * 0.22
                          + 0.10 * Math.sin(w * 0.5 + ph);
    // size IS the billing. The lead is nearly three times the size of a
    // background player, which is what makes "who is this about" legible at a
    // glance instead of something you have to work out.
    // ── the vibration ──
    // Every instrument retains a small near-audio-rate tremor, at a frequency
    // set by where it lives in the spectrum. This used to swing the entire
    // figure by nearly twenty percent; temporal supersampling then averaged
    // the core into a broad fog. Five percent is enough to leave a living
    // edge and a visible motion band without surrendering the solid centre.
    const fBase = 26 + 150 * clamp(s.centroid, 0, 1);
    const vib = 1 + (0.012 + 0.032 * clamp(s.amp, 0, 1.3))
                    * Math.sin(TAU * fBase * t + this.slot * 2.1)
              + 0.012 * s.attack * Math.sin(TAU * fBase * 2.7 * t);
    // Non-vocal players use the synthetic spectral carrier above. The lead
    // vocal uses the actual stem waveform, lightly, for coherent scale motion;
    // the larger anisotropic change is already written into lip W/H.
    const vocalVib = 1 + vocalWave(t) * VOCAL_GAIN
                                   * (0.006 + 0.012 * s.amp);
    const drawVib = this.faceRig ? vocalVib : vib;
    const billScale = this.isKit ? 1.05 : billCurve(b);
    const voiceScale = this.faceRig
      ? lerp(0.68, 1.18, Math.pow(clamp(this.voiceE, 0, 1), 0.62)) : 1;
    const sc = (this.isKit ? 1.76 : 1.15) * FSCALE[this.fig] * billScale
             * (0.80 + 0.45 * s.amp + (this.isKit ? 0.45 : 0.30) * s.attack)
             * ex[3] * drawVib * (1 + 0.12 * (this.attention || 0))
             * (this.faceRig ? lerp(1, 0.78, this.faceE || 0) : 1)
             * voiceScale * (this.isKit ? 1 + 0.24 * s.attack : 1);
    this.group.scale.setScalar(sc);

    // ── assembly and collapse ──
    // Each actor gets its own slice of the build, so they arrive one after
    // another rather than all at once; on the way out the vertices are pushed
    // outward along their own direction and the line is eaten from the front.
    const stagger = this.slot * 0.11;
    const bld = clamp((SHOW.build - stagger) / (1 - stagger || 1), 0, 1);
    const tr = SHOW.tear;
    if (tr > 0.001) for (let i = 0; i < this.m; i++) this.ints[i] *= (1 - tr * 0.75);
    this.line.set(this.cur, this.cols, this.ints, this.m, this.closed);
    // draw-on from one end during the build, eaten from the front on the way out
    const from = Math.floor(this.m * tr * 0.92);
    const to = Math.floor(this.m * (bld < 1 ? bld : 1));
    const span = Math.max(0, to - from - 1);
    this.line.geo.setDrawRange(from * 6, span * 6);
    this.line.mat.uniforms.uBoost.value = 1 + 0.5 * s.attack
                                        + 0.22 * (this.attention || 0)
                                        + (this.isKit ? 0.62 * s.attack : 0);
    const faceCurtain = faceActor && this !== faceActor
                      ? 1 - 0.72 * (faceActor.faceE || 0) : 1;
    const lipGate = this.faceRig ? 0.025 + 0.975 * this.voiceE : 1;
    this.line.mat.uniforms.uAlpha.value = this.presence * (1 - tr * 0.35)
                                       * faceCurtain * lipGate;
    if (this.faceRig) {
      this.faceRig.update(t, s, P, this.presence * (1 - tr * 0.55)
                                      * SHOW.build);
    }

    // haze from the send
    this.haze.mat.uniforms.uAlpha.value = this.send * 0.075 * this.presence
                                       * faceCurtain;
    if (this.send > 0.01) this.haze.copyFrom(this.line, this.m);

    // ghosts from the reverb
    const iv = P.ghostInterval;
    if (P.trailAmt > 0.02 && t - this.lastGhost > iv) {
      this.lastGhost = t;
      const g = this.ghosts[this.gi = (this.gi + 1) % GHOSTS];
      g.copyFrom(this.line, this.m);
      g.born = t; g.live = true;
      g.mesh.position.copy(this.group.position).sub(this.group.position);
      g.rot0 = this.group.rotation.y;
    }
    for (const g of this.ghosts) {
      if (!g.live) continue;
      const age = t - g.born, life = P.trailLife;
      if (age > life || age < 0) { g.mat.uniforms.uAlpha.value = 0; continue; }
      const e = Math.pow(1 - age / life, 1.6);
      g.mat.uniforms.uAlpha.value = e * Math.min(P.trailAmt, 0.85) * 0.38
                                  * this.presence * faceCurtain;
      g.mesh.rotation.y = age * 0.22 * P.trailAmt;
      g.mesh.scale.setScalar(1 + age * 0.10);
    }
  }
}

function lowerBound(a, x) {
  let lo = 0, hi = a.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < x) lo = m + 1; else hi = m; }
  return lo;
}

// ── build the cast ─────────────────────────────────────────────────────────
// eight bars, in seconds — the period everything paces itself to
const BAR8 = (() => {
  const b = D.bars;
  if (!b || b.length < 3) return 15.4;
  const spans = [];
  for (let i = 1; i < b.length; i++) spans.push(b[i].t - b[i - 1].t);
  spans.sort((x, y) => x - y);
  return spans[spans.length >> 1] * 8;
})();

const names = Object.keys(D.actors);
const actors = names.map((n, i) => new Actor(n, D.actors[n], HUES[i % HUES.length], i, names.length));
const ACTOR_BY_NAME = new Map(actors.map(a => [a.name, a]));
const kit = actors.find(a => a.isKit);
const faceActor = actors.find(a => a.fig === 'mouth');

// ── who is on stage ──────────────────────────────────────────────────────
// The stage holds two players and the kit. Everyone else is gone — not dimmed,
// gone — so that when someone walks on it MEANS something. Ranking is on the
// exported salience, which already includes a two-second look-ahead, so an
// entrance begins before the entry.
// The plan, not the meter. tools/stage_export.py works out in advance who
// leads which four-bar window — weighing novelty and fatigue against volume —
// and this only has to read it. Salience still modulates brightness and size
// within a role; it no longer decides who is on stage.
const ROLE_BILL = [3.4, 2.5, 1.0, 0.0];         // off, background, support, lead
const ROLE_ON   = [0.0, 0.42, 1.0, 1.0];
const DIR = D.direction || {roles: {}};
const SPOTLIGHTS = DIR.spotlights || [];
function roleAt(a, t) {
  const r = DIR.roles[a.name];
  if (!r) return a.isKit ? 1 : 0;
  return r[clamp(Math.round(t * D.rate), 0, r.length - 1)] | 0;
}
const LIVE = 0.35;         // below this a player is not audible enough to lead
function assignFocus(t, dt) {
  const k = 1 - Math.exp(-dt / 0.70);
  // ── read the plan ──
  // The gate is computed ahead of time in the export: it starts falling 0.6s
  // BEFORE a silence longer than a second and reaches zero one second into
  // it, so a player is already on their way out when they stop playing.
  let planLead = null;
  for (const a of actors) {
    a.sal = at(a.spec.salience, t);
    a.gate = at(a.spec.gate, t, 1);
    a.eff = a.isKit ? 1 : roleAt(a, t);
    if (a.eff === 3) planLead = a;
  }
  // ── and then use your eyes ──
  // The plan is made on four-bar windows; the gate moves in under a second.
  // So the plan can call somebody downstage across a stretch where they have
  // stopped playing — and since the gate then holds them off, the result is a
  // stage with nobody on it. A choreographer would not stand there and let
  // that happen: if the planned lead has gone quiet, the loudest player who
  // IS audible steps forward.
  if (!planLead || planLead.gate < LIVE) {
    let best = null;
    for (const a of actors) {
      if (a.isKit || a.gate < LIVE) continue;
      if (!best || a.sal > best.sal) best = a;
    }
    if (best) {
      if (planLead) planLead.eff = 1;
      best.eff = 3;
    }
  }
  // and a support, if the plan's choice has gone quiet too
  if (!actors.some(a => a.eff === 2 && a.gate >= LIVE)) {
    let best = null;
    for (const a of actors) {
      if (a.isKit || a.eff === 3 || a.gate < LIVE || a.sal < 0.20) continue;
      if (!best || a.sal > best.sal) best = a;
    }
    if (best) best.eff = 2;
  }

  // A genuine entrance gets one short look, beginning just before its pulse.
  // This does not replace the four-bar plan: it momentarily promotes the new
  // player, then hands the centre back to whoever the director chose.
  let spot = null, nextSpot = null;
  for (const cue of SPOTLIGHTS) {
    const pre = cue.pre ?? 0.42, dur = cue.dur ?? 1.05;
    if (t >= cue.t - pre && t < cue.t + dur) {
      // A cue that has actually landed owns the eye over another cue that is
      // merely in its anticipation. Before either lands, take the nearest.
      if (cue.t <= t) spot = cue;
      else if (!nextSpot) nextSpot = cue;
    }
    if (cue.t - pre > t) break;
  }
  if (!spot) spot = nextSpot;
  let spotActor = null, spotE = 0;
  if (spot) {
    spotActor = ACTOR_BY_NAME.get(spot.actor);
    if (spotActor) {
      const pre = spot.pre ?? 0.42, age = t - spot.t;
      spotE = age < 0 ? smooth(clamp((age + pre) / pre, 0, 1))
                      : Math.exp(-age / Math.max(0.25, spot.dur ?? 1.05));
      for (const a of actors) {
        if (a !== spotActor && a.eff === 3) a.eff = a.gate >= LIVE ? 2 : 1;
      }
      spotActor.eff = 3;
    }
  }
  // A full-face vocal punctuation is itself a directorial cue. Briefly bring
  // the singer forward even if the phrase plan currently has another player
  // leading, then return to that plan as the face comes apart.
  const faceSpot = faceActor ? faceCueAt(t) : 0;
  if (faceActor && faceSpot > 0.06 && (!spotActor || faceSpot > spotE * 0.85)) {
    for (const a of actors) {
      if (a !== faceActor && a.eff === 3) a.eff = a.gate >= LIVE ? 2 : 1;
    }
    faceActor.eff = 3;
    spotActor = faceActor;
    spotE = Math.max(spotE, faceSpot);
  }

  for (const a of actors) {
    const role = a.eff;
    a.role = role;
    a.attention = a === spotActor ? spotE : 0;
    a.focus(t, dt, ROLE_ON[role] * a.gate, (role >= 1 ? 1 : 0) * a.gate);
    const bill = a.isKit ? 1.9 : ROLE_BILL[role];
    if (a.bill === undefined) a.bill = bill;
    a.bill += (bill - a.bill) * k;             // a change of lead is a MOVE
    // Drive the name card from an actual visible entrance, not only a planned
    // role change. A plan can promote a player several beats before its gate
    // opens; keying this to the role alone meant the card had expired before
    // the player appeared.
    const featured = role >= 2 && a.gate >= 0.18;
    if (featured && !a.wasFeatured) a.enteredAt = t;
    a.wasFeatured = featured;
  }
}

// ── stage depth ───────────────────────────────────────────────────────────
// The actor paths are composed in world space, but the hierarchy is a screen
// promise: a background orbit must never pass in front of the subject or grow
// larger through perspective. Enforce that promise in camera space after the
// camera has moved. The lead owns a shallow central plane; support and
// background live on progressively wider, deeper rings.
const STAGE_V = new THREE.Vector3();
function placeHierarchyTarget(a, dt, tau = 0.34) {
  // Store the correction in camera space. This gives focus changes a real
  // screen-space move instead of teleporting the actor when the selected hero
  // or its minimum orbit radius changes between adjacent samples.
  if (!a.hierView) a.hierView = new THREE.Vector3();
  if (!a.hierPrimed || dt > 0.12) {
    a.hierView.copy(STAGE_V);
    a.hierPrimed = true;
  } else {
    a.hierView.lerp(STAGE_V, 1 - Math.exp(-dt / tau));
  }
  a.group.position.copy(a.hierView).applyMatrix4(camera.matrixWorld);
}

// ── vocalist choreography ────────────────────────────────────────────────
// Dance is an accent, not the vocalist's idle state. Cues are expressed in
// local section BEATS, so they stay locked to the groove through all 942
// tempo-ramp points. Verses receive one small gesture; choruses and the turn
// get a few longer phrases; only two structural accents earn a full spin.
const VOCAL_DANCE_CUES = {
  'verse-1':      [{a: 20, b: 24, kind: 'rock',   gain: 0.32}],
  'chorus-1':     [{a:  0, b:  8, kind: 'bounce', gain: 0.58},
                   {a: 20, b: 28, kind: 'bop',    gain: 0.62}],
  'verse-2':      [{a: 28, b: 32, kind: 'bob',    gain: 0.34}],
  'chorus-2':     [{a:  0, b: 12, kind: 'bop',    gain: 0.66},
                   {a: 20, b: 28, kind: 'rock',   gain: 0.52}],
  'verse-3':      [{a: 44, b: 48, kind: 'bob',    gain: 0.30}],
  'recap':        [{a:  8, b: 16, kind: 'bounce', gain: 0.54},
                   {a: 40, b: 48, kind: 'rock',   gain: 0.56}],
  'turn':         [{a:  0, b: 10, kind: 'bop',    gain: 0.68, spinBeat: 4}],
  'final-chorus': [{a:  0, b: 12, kind: 'bop',    gain: 0.72, spinBeat: 8},
                   {a: 20, b: 32, kind: 'bounce', gain: 0.72}],
};
const DANCE_RIGHT = new THREE.Vector3(), DANCE_UP = new THREE.Vector3();

function beatPosition(t) {
  if (BEATS.length < 2) return t * 2;
  const i = clamp(lowerBound(BEATS, t) - 1, 0, BEATS.length - 2);
  return i + clamp((t - BEATS[i]) / Math.max(1e-5, BEATS[i + 1] - BEATS[i]), 0, 1);
}

function vocalDance(t, actor) {
  const zero = {x: 0, y: 0, scale: 1, yaw: 0, pitch: 0, roll: 0, spin: 0, e: 0};
  if (!actor || !actor.group.visible) return zero;
  const sec = sectionAt(t), cues = VOCAL_DANCE_CUES[sec.id] || [];
  if (!cues.length) return zero;
  const beat = beatPosition(t) - beatPosition(sec.t0);
  let cue = null, env = 0;
  for (const c of cues) {
    if (beat < c.a - 0.75 || beat > c.b + 0.75) continue;
    const ein = smooth(clamp((beat - c.a + 0.10) / 0.70, 0, 1));
    const eout = smooth(clamp((c.b - beat + 0.10) / 0.70, 0, 1));
    const e = ein * eout;
    if (e > env) { cue = c; env = e; }
  }
  if (!cue) return zero;

  // Keep the groove alive across a breath, but let real vocal amplitude and
  // billing determine how much attention the movement is allowed to claim.
  const voice = 0.42 + 0.58 * clamp(actor.voiceE || 0, 0, 1);
  const featured = actor.role >= 2 ? 1 : 0.38;

  const PX = 76, PAD = 6;

  const chars = [...set].filter(c => c !== ' ');
  const COLS = 12;
  const probe = document.createElement('canvas').getContext('2d');
  const FONT = `600 ${PX}px -apple-system, Helvetica, Arial, sans-serif`;

function layoutLine(text, lineT) {

  // word to its own onset. That is what lets the displacement happen word by

  // said, in its own moment, rather than the whole line breathing together.

      if (!inWord) { inWord = true; wi++; }
      out.push({chr, x: x + a / 2, w: wi - 1, cell: CHAR_ATLAS.cell.get(chr)});
    }

    times.push(k + i < D.words.length ? D.words[k + i][0] : null);

function updateLine(t, dt, lift) {

    if (t >= D.lines[i].t - 0.20 && t < D.lines[i].t1 + 0.60) { cur = i; break; }

          * (1 - Math.exp(-dt / (cur >= 0 ? 0.14 : 0.48)));
  if (cur >= 0 && cur !== LINE.idx) {
    LINE.idx = cur;
    LINE.layout = layoutLine(D.lines[cur].text.slice(0, LINE_MAX), D.lines[cur].t);
  }
  const vis = LINE.e > 0.012 && LINE.idx >= 0;
  for (const sp of LINE.glyphs) sp.visible = false;
  if (!vis || !LINE.layout) return;

  const H = 0.235;

  const atk = vocalActor ? vocalActor.state.attack : 0;
  const live = clamp(amp * 1.10 + atk * 0.85, 0, 1.7);
  // brightness sets the pitch of the vibration; a bright syllable buzzes
  // faster than a dark one, which is roughly what your ear expects

  LINE.layout.glyphs.forEach((o, i) => {
    if (i >= LINE_MAX || !o.cell) return;
    const sp = LINE.glyphs[i];
    sp.material.map.offset.set(o.cell.u, o.cell.v);
    sp.material.map.repeat.set(o.cell.du, o.cell.dv);

    // ── this word's own moment ──
    // A short rise into the onset and a longer settle out of it. Before its
    // onset a word is small and dim and still; through it the vocal's
    // amplitude drives the whole distortion; after it the word stays lit but
    // stops moving. So the line reads left to right as it is sung.
    const wt = o.t;
    const age = wt === null ? 999 : t - wt;
    const pre = age < 0 ? clamp(1 + age / 0.22, 0, 1) : 1;      // anticipation
    const hit = age < 0 ? 0 : Math.exp(-age / 0.34);            // its moment
    const said = age >= -0.02 ? 1 : 0;

    // A small high-frequency tremor sits under the slower word-by-word lift.
    // The earlier version made temporal blur carry most of the typography;
    // keeping the carrier restrained lets the lyric react without losing its
    // counters and stems at master resolution.
    const drive = hit * live * lift;
    const fv = 45 + 145 * clamp(vocalCen, 0, 1);
    const w1 = TAU * fv, w2 = TAU * fv * 0.61, w3 = TAU * fv * 1.37;
    const jit = i * 1.73;                       // each glyph on its own phase
    const slow = i * 0.85 - t * 7.6;            // the slow travelling wave

                    + drive * 0.026 * Math.sin(w1 * t + jit)
                    + hit * 0.030 * lift;

  for (const k of PKEYS) P[k] = lerp(cur[k], b[k], f);
  P.tint = [0, 1, 2].map(k => lerp(cur.tint[k], b.tint[k], f) / 255);
  P.id = f > 0.5 && nxt ? nxt.id : cur.id;
  P.arch = f > 0.5 && nxt ? nxt.arch : cur.arch;
  // ── the palette belongs to the SECTION ──
  // A verse and a chorus should not merely behave differently, they should be
  // different colours — the hue family, the saturation and the value all come
  // from the archetype, and they cross-dissolve with everything else.
  P.hues = (cur.hues || [0.06]).map((h, k) => {
    const h2 = (b.hues || cur.hues)[k] ?? h;
    let d = h2 - h;                       // go the short way round the wheel
    if (d > 0.5) d -= 1; if (d < -0.5) d += 1;

  P.val = lerp(cur.val ?? 0.55, b.val ?? 0.55, f);

  // ── the introduction ──
  // Each section is announced by its archetype's own effect, played across
  // the whole frame at the boundary. It is short, and it is the only moment
  // the picture is allowed to be about the cut rather than the music.
  // ── telegraphing ──
  // The air starts moving 1.5 seconds BEFORE the boundary and settles 0.6
  // after it. So the change is announced rather than reported: by the time the
  // downbeat lands you have already felt the room change, and the intro
  // effect confirms something you were half expecting.
  const BG_PRE = 1.5, BG_POST = 0.6;

  P.bgA2 = from.bg2 || [0, 0, 0];
  P.bgB = to.bg || P.bgA;
  P.bgB2 = to.bg2 || P.bgA2;
  P.bgF = nxt ? clamp((t - (nxt.t0 - BG_PRE)) / (BG_PRE + BG_POST), 0, 1) : 0;
  // an abrupt archetype gets a directional wipe; a gentle one dissolves
  P.bgWipe = to.intro === 'sweep' || to.intro === 'shock'
          || to.intro === 'burst' ? 1 : 0;

  P.intro = 0; P.introKind = 0;
  const sec = f > 0.5 && nxt ? nxt : cur;
  const age = t - sec.t0;
  if (age >= -0.12 && age < INTRO_LEN) {
    P.intro = age < 0 ? clamp((age + 0.12) / 0.12, 0, 1)
                      : Math.pow(1 - age / INTRO_LEN, 1.35);
    P.introKind = INTRO_KIND[sec.intro] ?? 0;
    P.introAge = Math.max(0, age) / INTRO_LEN;
  }
  return P;

// Hand-rolled, because the laser look lives or dies on it and it needs to be
// tuned rather than dropped in. Bright-pass, two blur scales, additive
// composite. Half-float targets so the additive beams can go well past 1.0
// before they are tone-mapped — that overflow is what makes a beam look hot.

  // targets — the default framebuffer is never drawn to. Multisampling the
  // scene target is where the beams actually get their edges, and on any real
  // GPU it is close to free.

  // large post-process halos that made the words difficult to read.

  // past 1.0 without the 8-bit banding a canvas would impose

  rtA = new THREE.WebGLRenderTarget(w >> 1, h >> 1, rtOpts);
  rtB = new THREE.WebGLRenderTarget(w >> 1, h >> 1, rtOpts);
  rtC = new THREE.WebGLRenderTarget(w >> 2, h >> 2, rtOpts);
  rtD = new THREE.WebGLRenderTarget(w >> 2, h >> 2, rtOpts);

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);
const VERT_Q = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const brightMat = new THREE.ShaderMaterial({
  vertexShader: VERT_Q, uniforms: {tDiffuse: {value: null}, uThresh: {value: 0.50}},
  fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uThresh;
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = max(max(c.r,c.g),c.b);

  vertexShader: VERT_Q,
  uniforms: {tDiffuse: {value: null}, uDir: {value: new THREE.Vector2()}},
  fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform vec2 uDir;
    void main(){
      vec3 s = texture2D(tDiffuse, vUv).rgb * 0.227027;

const COMP_UNIFORMS = {
  tScene: {value: null}, tUI: {value: null}, tB1: {value: null}, tB2: {value: null},
  uGlow: {value: 1.0}, uTint: {value: new THREE.Color(0, 0, 0)},
  uUi: {value: 1.0},
  uScale: {value: 1.0}, uFlash: {value: 0.0},
  uIntro: {value: 0.0}, uKind: {value: 0.0}, uAge: {value: 0.0},
  uAspect: {value: 16 / 9},
  // the air: centre colour, edge colour, and the wipe that changes them
  uBgA: {value: new THREE.Color(0, 0, 0)},
  uBgA2: {value: new THREE.Color(0, 0, 0)},
  uBgB: {value: new THREE.Color(0, 0, 0)},
  uBgB2: {value: new THREE.Color(0, 0, 0)},
  uBgF: {value: 0.0}, uBgWipe: {value: 0.0}};
let FLASH = 0;
const COMP_FRAG = `varying vec2 vUv;
    uniform sampler2D tScene, tUI, tB1, tB2;
    uniform float uGlow, uUi, uScale, uFlash, uIntro, uKind, uAge, uAspect;

    uniform vec3 uTint, uBgA, uBgA2, uBgB, uBgB2;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }
    void main(){

             + texture2D(tB1, vUv).rgb * 0.30 * uGlow
             + texture2D(tB2, vUv).rgb * 0.18 * uGlow
             + texture2D(tUI, vUv).rgb * 0.94 * uUi;

      // A wide radial wash from the section's own colour, falling off to a
      // deeper edge. Held dark on purpose: the beams are additive, so a bright
      // background does not tint the picture, it erases it. This is what makes
      // a chorus read as a chorus from across the room before you have parsed
      // a single element in the frame.
      {
        vec2 bq = (vUv - vec2(0.5, 0.46)) * vec2(uAspect, 1.0);

          float x = (q.x / uAspect + 0.5);

// ── liner notes ──────────────────────────────────────────────────────────
// Eight annotations across the record, each computed from the DAWproject at
// export time and each timed to land on the thing it describes. They sit at
// the lower left, on the one piece of frame nothing else claims: the lyric
// owns the bottom centre, the pacing metrics the top left, the panel the
// right. Heading, then two or three lines of body, faded up and away.
//
// The reveal is a wipe rather than a fade — the body is drawn left to right
// over about a second — because a block of text appearing whole demands to be
// read now, and a block that arrives at reading speed does not.
const LINER = (() => {
  const items = D.liner || [];
  const c = document.createElement('canvas');
  c.width = 1180; c.height = 252;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({map: tex, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false});
  const sp = new THREE.Sprite(mat);
  sp.renderOrder = 8; sp.visible = false;
  sp.layers.set(UI_LAYER);
  camera.add(sp);
  return {items, c, g: c.getContext('2d'), tex, sp, idx: -1, lines: 0,
          ar: c.width / c.height};
})();

function drawLiner(item) {
  const {c, g} = LINER;
  g.clearRect(0, 0, c.width, c.height);
  const HS = 32, BS = 40, LH = 51;
  g.textBaseline = 'top';
  g.font = `600 ${HS}px -apple-system, Helvetica, Arial, sans-serif`;
  g.letterSpacing = '5px';
  g.fillStyle = 'rgba(232,190,110,1)';
  g.fillText(item.head, 6, 6);
  g.letterSpacing = '0px';
  g.font = `300 ${BS}px -apple-system, Helvetica, Arial, sans-serif`;
  g.fillStyle = 'rgba(214,222,234,1)';
  // wrap by hand — the body is written to be three short lines, not a column
  const words = item.body.split(' ');
  let line = '', y = 6 + HS + 22, n = 0;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > c.width - 20 && line) {
      g.fillText(line, 6, y); y += LH; n++; line = w;
    } else line = test;
  }
  if (line) { g.fillText(line, 6, y); n++; }
  LINER.lines = n;
  LINER.tex.needsUpdate = true;
}

function updateLiner(t, showE) {
  const items = LINER.items;
  let cur = -1;
  for (let i = 0; i < items.length; i++) {
    const a = t - items[i].t;
    if (a >= -0.05 && a < items[i].dur) { cur = i; break; }
  }
  if (cur < 0) { LINER.sp.visible = false; return; }
  if (cur !== LINER.idx) { LINER.idx = cur; drawLiner(items[cur]); }
  const it = items[cur], age = t - it.t;
  const IN = 0.55, OUT = 0.9;
  const e = age < IN ? age / IN
          : age > it.dur - OUT ? clamp((it.dur - age) / OUT, 0, 1) : 1;
  const soft = clamp(e, 0, 1);
  LINER.sp.material.opacity = soft * soft * 0.80 * showE;
  LINER.sp.visible = LINER.sp.material.opacity > 0.01;
  if (!LINER.sp.visible) return;
  // Sized so the body text lands near 28px at 1080p — a note nobody can read
  // is worse than no note, and this is the one element on the stage whose
  // entire job is to be read.
  const h = 0.63;
  LINER.sp.scale.set(h * LINER.ar, h, 1);
  // lower left, clear of the pacing metrics above and the lyric below
  LINER.sp.position.set(-2.78 + h * LINER.ar / 2, -0.34 - 0.06 * (1 - soft), -3.4);

// ── the title ────────────────────────────────────────────────────────────

const TITLE = (() => {
  const text = (D.title || 'untitled').toUpperCase();
  const c = document.createElement('canvas');

  while (g.measureText(text).width > c.width - 120 && px > 40) {
    px -= 6;
    g.font = `200 ${px}px -apple-system, Helvetica, Arial, sans-serif`;
  }
  g.textBaseline = 'middle';
  g.letterSpacing = `${Math.round(px * 0.14)}px`;
  g.font = `200 ${px}px -apple-system, Helvetica, Arial, sans-serif`;

  const mat = new THREE.SpriteMaterial({map: tex, transparent: true, opacity: 0,

  sp.renderOrder = 9; sp.visible = false;

function updateTitle(t) {

  const e = clamp((SHOW.tear - 0.30) / 0.45, 0, 1);
  const soft = e * e * (3 - 2 * e);
  TITLE.sp.visible = soft > 0.006;

// ── the show: assembling, and coming apart ───────────────────────────────
// The song has to start from nothing and end as nothing, and neither should
// be a fade. BUILD draws each figure on from a single point, the way a plotter
// or a galvo actually would, staggered so the cast arrives in sequence. TEAR
// unravels them from the other end and throws the vertices outward, so the
// last thing you see is the geometry losing its grip rather than a dimmer.
const BUILD_LEN = 7.5, TEAR_LEN = 10.0;
const SHOW = {build: 0, tear: 0};
function updateShow(t) {
  const dur = D.duration;
  const b = clamp(t / BUILD_LEN, 0, 1);
  SHOW.build = b * b * (3 - 2 * b);
  const r = clamp((t - (dur - TEAR_LEN)) / TEAR_LEN, 0, 1);
  SHOW.tear = r * r;
}

// ── the frame ──────────────────────────────────────────────────────────────

const hud = document.getElementById('hud');

function setTime(t, dt) {

  const fb  = L.feedback ? at(L.feedback.v, t, 0.3) : 0.3;
  const on  = L.onoff ? at(L.onoff.v, t, 1) : 1;

  P.trailLife = 0.35 + dec * 2.6;

  // transpose -> global twist. Both transpose lanes here are set-and-forget,
  // so the twist instead follows how far the main MIDI part has drifted from
  // its own centre — the same idea (the music has been moved) from live data.
  let tw = 0;
  if (L.transpose.length) { for (const l of L.transpose) tw += at(l.v, t, 0) / 12; }
  else if (midiActor) tw = clamp((at(midiActor.spec.meanpitch, t, 60) - 60) / 14, -1, 1);

  // pan -> lead vocal azimuth. The pan lane is also set-and-forget, so the
  // vocal instead drifts on its own spectral tilt: bright syllables push it
  // one way, dark ones the other.
  const pan = L.pan ? at(L.pan.v, t, 0.5) * 2 - 1
            : leadActor ? clamp(at(leadActor.spec.tilt, t, 0) * 1.1, -1, 1) * 0.55 : 0;

  for (const a of actors) {
    a.twist = tw;
    a.pan = (a.name.toLowerCase().includes('lead') ? pan : 0);
    a.send = 0;
  }
  for (const s of L.sends) if (s.actor) s.actor.send = at(s.v, t, 0);

  assignFocus(t, dt);
  for (const a of actors) {
    if (a.presence > 0.004 || (a.stageIn ?? 0) > 0.01) a.step(t, dt, P);
    else { a.lastDt = dt; a.state = a.read(t); }   // cheap, keeps the lyric fed
  }
